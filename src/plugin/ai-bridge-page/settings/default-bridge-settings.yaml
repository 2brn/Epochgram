sharedContext: |
  Ignore dates and empty content.
  Group by topics, compress, remove duplicates and metaphrases.
  Order by frequency.

format: plain-text
preference: capability
expectedInputLanguages: [en]
outputLanguage: en
expectedContextLanguages: [en]

backend:
  mode: native
  maxRetries: 3
  cloud:
    provider: openai
    apiKey: "{{your-openai-key-secret}}"
    modelName: gpt-4o-mini
    baseUrl: https://api.openai.com/v1

maxRelatedChars: 300

reduce:
  context: |
    Recursive summary reduction.
    Preserve dominant topics and recurring entities.
  
  type: tldr
  length: long
  maxChunkChars: 3000
  maxDepth: 3

records:
  context: |
    File:
    {{filePath}}
    
    Preserve facts, entities, terminology, and concrete topics.
    Remove repetition, filler, boilerplate, and metaphrases.
    
  type: tldr
  length: short
    
  maxInputChars: 3000
  maxOutputWords: 30

epochs:
  - period: day-2weeks
    context: |
      Short-term activity summary.
      Recent events, actions, tasks, places, people, projects.
      Output max 12 words, nouns only.

    type: tldr
    length: short
    maxFileChars: 300
    maxOutputWords: 30

  - period: month-year
    context: |
      Broad period summary.
      Long-term themes, domains, projects, interests, recurring topics.
      Output max 12 words, nouns only.

    type: tldr
    length: medium
    maxFileChars: 300
    maxOutputWords: 30