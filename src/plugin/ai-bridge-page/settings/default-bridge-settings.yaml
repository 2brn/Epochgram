sharedContext: |
  Use only input facts. Keep exact names from text or paths, not categories.
  Omit dates, filler, duplicates.

format: plain-text
preference: capability
expectedInputLanguages: [en]
outputLanguage: en
expectedContextLanguages: [en]

backend:
  mode: native
  maxRetries: 3
  cloud:
    provider: openai
    apiKey: "{{openai-key}}"
    modelName: gpt-4o-mini
    baseUrl: https://api.openai.com/v1

maxRelatedChars: 300

reduce:
  context: |
    Merge by named subject; preserve names, facts and status.
  
  type: tldr
  length: long
  maxChunkChars: 3000
  maxDepth: 3

records:
  context: |
    File: {{filePath}}
    Keep subject names, key facts, decisions and task status. Omit boilerplate.
    
  type: tldr
  length: short
    
  maxInputChars: 3000
  maxOutputWords: 30

epochs:
  - period: day-2weeks
    context: |
      Name specific projects or events with actions and status.
      Output max 12 words; not category lists.

    type: tldr
    length: short
    maxFileChars: 300
    maxOutputWords: 30

  - period: month-year
    context: |
      Name main projects or subjects with status and milestones.
      Output max 12 words; not broad themes.

    type: tldr
    length: medium
    maxFileChars: 300
    maxOutputWords: 30